<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY, MY EUNIVERSEEEE 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose:      #f4a7b9;
    --rose-deep: #e07090;
    --blush:     #fde8ed;
    --cream:     #fdf6f0;
    --petal:     #fce4ec;
    --text:      #4a2535;
    --text-soft: #8a5a6a;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    min-height: 100vh;
  }

  #hearts-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; }

  section {
    max-width: 680px;
    margin: 0 auto;
    padding: 80px 32px;
  }

  /* ── MUSIC PLAYER ── */
  #music-player {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    border-radius: 999px;
    padding: 10px 20px 10px 14px;
    box-shadow: 0 4px 24px rgba(224,112,144,0.25);
    border: 1.5px solid var(--rose);
    transition: all 0.3s ease;
  }

  .music-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--rose-deep);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    color: white;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
  }

  .music-info {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
    min-width: 0;
  }

  .music-title {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }

  .music-sub { font-size: 0.65rem; color: var(--text-soft); }

  .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; margin-left: 4px; }
  .music-bar { width: 3px; background: var(--rose-deep); border-radius: 2px; animation: musicBar 0.8s ease-in-out infinite alternate; }
  .music-bar:nth-child(1) { animation-delay: 0s;    height: 6px; }
  .music-bar:nth-child(2) { animation-delay: 0.15s; height: 12px; }
  .music-bar:nth-child(3) { animation-delay: 0.3s;  height: 8px; }
  .music-bar:nth-child(4) { animation-delay: 0.1s;  height: 14px; }
  .music-bar:nth-child(5) { animation-delay: 0.25s; height: 5px; }
  .music-bars.paused .music-bar { animation-play-state: paused; }

  @keyframes musicBar { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }
  #yt-iframe { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 32px;
  }

  .petal-ring { font-size: 2rem; letter-spacing: 0.4em; margin-bottom: 24px; opacity: 0; animation: fadeUp 1s ease forwards 0.3s; }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 300;
    line-height: 1.05;
    color: var(--rose-deep);
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.6s;
  }
  .hero-title em { font-style: italic; font-weight: 300; }
  .hero-subtitle { margin-top: 20px; font-size: 1rem; color: var(--text-soft); letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; animation: fadeUp 1s ease forwards 0.9s; }
  .hero-date { margin-top: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; color: var(--rose-deep); opacity: 0; animation: fadeUp 1s ease forwards 1.1s; }
  .scroll-hint { margin-top: 60px; font-size: 0.8rem; color: var(--text-soft); letter-spacing: 0.15em; opacity: 0; animation: fadeUp 1s ease forwards 1.4s; }
  .scroll-hint span { display: block; margin-top: 8px; font-size: 1.2rem; animation: bounce 2s ease-in-out infinite; }

  /* ── DIVIDERS & LABELS ── */
  .divider { display: flex; align-items: center; gap: 16px; margin: 0 auto 48px; max-width: 300px; }
  .divider-line { flex: 1; height: 1px; background: var(--rose); opacity: 0.5; }
  .divider-heart { color: var(--rose-deep); font-size: 1rem; }
  .section-label { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 12px; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 300; color: var(--rose-deep); line-height: 1.15; margin-bottom: 40px; }
  .section-title em { font-style: italic; }

  /* ── LETTER ── */
  #letter {
    background: white; border-radius: 2px; padding: 64px 48px;
    box-shadow: 0 4px 40px rgba(240,160,185,0.15);
    position: relative; border-top: 3px solid var(--rose);
  }
  #letter::before { content: '\275D'; font-family: 'Cormorant Garamond', serif; font-size: 5rem; color: var(--rose); opacity: 0.3; position: absolute; top: 16px; left: 24px; line-height: 1; }
  .letter-greeting { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.4rem; color: var(--rose-deep); margin-bottom: 24px; }
  .letter-body { font-size: 1rem; line-height: 1.9; color: var(--text); white-space: pre-line; }
  .letter-sign { margin-top: 36px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; color: var(--rose-deep); text-align: right; }

  /* ── REASONS ── */
  .reasons-grid { display: grid; gap: 16px; }
  .reason-card { background: white; border-radius: 2px; padding: 28px 32px; display: flex; align-items: flex-start; gap: 20px; box-shadow: 0 2px 20px rgba(240,160,185,0.12); border-left: 3px solid var(--rose); }
  .reason-number { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: var(--rose); line-height: 1; min-width: 40px; }
  .reason-text { font-size: 1rem; line-height: 1.7; color: var(--text); padding-top: 6px; }

  /* ── GALLERY ── */
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .gallery-item {
    position: relative; overflow: hidden; border-radius: 4px; aspect-ratio: 1;
    box-shadow: 0 4px 20px rgba(224,112,144,0.2); transition: transform 0.3s ease;
    cursor: pointer; background: #eee;
  }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item:hover { transform: scale(1.05); z-index: 2; }
  .gallery-sub { font-size: 0.9rem; color: var(--text-soft); margin-top: -28px; margin-bottom: 32px; line-height: 1.6; }

  /* ── PASSWORD LOCK ── */
  #locked-section { margin-top: 40px; }
  .lock-card { background: white; border-radius: 2px; padding: 56px 48px; text-align: center; box-shadow: 0 4px 40px rgba(240,160,185,0.15); border-top: 3px solid var(--rose-deep); }
  .lock-input { padding: 12px 18px; border: 1.5px solid var(--rose); border-radius: 999px; font-family: 'Jost', sans-serif; text-align: center; outline: none; width: 200px; margin-bottom: 10px; }
  .lock-btn { padding: 12px 22px; background: var(--rose-deep); color: white; border: none; border-radius: 999px; cursor: pointer; }
  #unlocked-content { display: none; margin-top: 40px; animation: fadeUp 0.8s ease; }
  .secret-card { background: var(--petal); border-radius: 2px; padding: 24px 28px; font-size: 1rem; line-height: 1.75; color: var(--text); border-left: 3px solid var(--rose-deep); margin-bottom: 16px; text-align: left; }

  /* ANIMATIONS */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

  @media (max-width: 480px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
